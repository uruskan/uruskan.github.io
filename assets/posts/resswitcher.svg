    <radialGradient id="g2" cx="0.8" cy="0.75" r="0.6"><stop offset="0" stop-color="#0d9496" stop-opacity="0.4"/><stop offset="1" stop-color="#0d9496" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
